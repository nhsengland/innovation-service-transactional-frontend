<dl class="nhsuk-summary-list">
  <div *ngFor="let item of selectedRegulations; index as i" class="nhsuk-summary-list__row">
    <dt class="nhsuk-summary-list__key">{{ item | irv3translate: "items" : "standards" }}</dt>
    <dd class="nhsuk-summary-list__value text-pre-wrap">
      <p *ngFor="let doc of regulationsDocuments[item]">
        <shared-file-download [file]="doc.file" [fileId]="doc.id" [fileName]="doc.name" [label]="doc.name"></shared-file-download>
        <span class="d-block">({{ doc.file.extension | uppercase }}{{ doc.file.size ? ", " + (doc.file.size | bytesPrettyPrint) : "" }})</span>
      </p>
    </dd>
    <dd class="nhsuk-summary-list__actions">
      <a
        *ngIf="certificationsHasDocuments(item)"
        [routerLink]="baseUrl + '/record/sections/REGULATIONS_AND_STANDARDS/regulations/' + item"
        attr.aria-label="View {{ item }} details"
        >More details</a
      >
      <a
        *ngIf="shouldAddDocument(item) && ctx.user.isInnovator()"
        routerLink="{{ baseUrl }}/documents/new"
        [queryParams]="{ regulationId: item }"
        attr.aria-label="Add document for {{ item }} "
        >Continue</a
      >
    </dd>
  </div>
</dl>
